[project]
name = "model-overthinking-probe"
version = "0.1.0"
description = "Linear probes on frozen LLM hidden states for predicting remaining output token count."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.11.0",
    "datasets>=4.2.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "torch>=2.9.0",
    "transformers>=4.57.1",
    "wandb>=0.22.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miol"]
