# Hydra instantiation target
_target_: miol.data.HuggingFaceDatasetBuilder

dataset_name: trivia_qa

num_train_samples: 10000 # -1 = use all available data, or specify a number 
num_eval_samples: -2000  # -1 = use all available data, or specify a number

# HuggingFace dataset parameters
hf_dataset: mandarjoshi/trivia_qa
hf_config: rc.nocontext
hf_prompt_col: question
hf_completion_col: answer
hf_eval_split: test
hf_train_split: train

# Chat template system prompt
hf_system_prompt: "You are a helpful assistant that solves problems step by step."